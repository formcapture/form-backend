version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/app"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      # packages that must move together, any update type
      eslint:
        patterns: ["eslint", "@eslint/*", "@stylistic/*", "typescript-eslint", "@typescript-eslint/*", "eslint-plugin-*"]
      i18next:
        patterns: ["i18next", "i18next-*", "react-i18next"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      ag-grid:
        patterns: ["@ag-grid-community/*"]
      # everything else: one PR per directory for minor/patch
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TS 7 blocked by typescript-eslint (<6.1), typedoc (<=6.0), ts-jest (<7)
      - dependency-name: "typescript"
        versions: [">=7"]
      # needs Node >=26.13; cycjimmy/semantic-release-action@v8 runs on node24
      - dependency-name: "semantic-release"
        versions: [">=26"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"

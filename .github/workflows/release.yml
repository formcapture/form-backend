name: Release form-backend

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources 🔰
        uses: actions/checkout@v7
        with:
          # Do not store the workflow's GITHUB_TOKEN in the git config. Otherwise semantic-release
          # pushes the release commit as github-actions[bot], which cannot bypass the ruleset on main,
          # instead of using SEMANTIC_RELEASE_TOKEN.
          persist-credentials: false

      - name: Setup Node.js 👷🏻
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies ⏬
        run: npm ci

      - name: Release 🚀
        uses: cycjimmy/semantic-release-action@v8
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Checkout sources 🔰 again # Check out the release commit created by semantic-release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.semantic.outputs.new_release_git_tag }}

      - name: Log in to the Container registry
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image 🐳
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          # build from the checked out release commit; without a context the action builds the
          # git ref that triggered the workflow, i.e. the commit before the release commit
          context: .
          push: true
          tags: ghcr.io/formcapture/form-backend:latest,ghcr.io/formcapture/form-backend:${{ steps.semantic.outputs.new_release_version }}
